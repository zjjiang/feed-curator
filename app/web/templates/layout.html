<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}feed-curator{% endblock %}</title>
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --border: #e5e2db;
    --text: #2b2a27; --muted: #8a867c; --accent: #b3541e;
    --ok: #2e7d32; --warn: #b28900; --err: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  nav { background: var(--card); border-bottom: 1px solid var(--border);
        padding: 0 20px; display: flex; align-items: center; gap: 4px; }
  nav .brand { font-weight: 700; margin-right: 16px; color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; padding: 12px 10px; display: inline-block; }
  nav a.active, nav a:hover { color: var(--text); }
  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px;
         border-radius: 10px; background: #efece5; color: var(--muted); margin-right: 4px; }
  .tag.kind-paper { background: #e8eef7; color: #2b5aa8; }
  .tag.kind-repo { background: #e9f3e8; color: #2e7d32; }
  .tag.kind-article { background: #f4ece2; color: #9a5b1f; }
  .tag.domain { background: #f0e6f4; color: #7a3d96; }
  .stars { color: #d99a26; letter-spacing: 1px; }
  .tag.gh-stars { background: #eef4ee; color: #1b5e20; font-weight: 600; }
  a { color: inherit; }
  .title-link { font-weight: 600; text-decoration: none; }
  .title-link:hover { color: var(--accent); }
  button, .btn { border: 1px solid var(--border); background: #fff; color: var(--text);
          border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer;
          text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=text], input[type=url], input[type=number], textarea, select {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
    font: inherit; width: 100%; background: #fff; }
  form.inline { display: inline; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .status-done { color: var(--ok); } .status-running { color: var(--warn); }
  .status-failed, .status-cancelled { color: var(--err); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filters select { width: auto; }
  .pager { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; }
  .summary .card { flex: 1 1 140px; text-align: center; margin: 0; }
  .summary .num { font-size: 22px; font-weight: 700; }
  .error-flash { background: #fdecea; border: 1px solid #f5c6c1; color: var(--err);
                 padding: 8px 14px; border-radius: 8px; margin-bottom: 12px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  pre.content { white-space: pre-wrap; word-break: break-word; font: inherit; }
</style>
</head>
<body>
{% if request.url.path.startswith('/admin') %}
<nav>
  <span class="brand"><a href="/" style="color:var(--accent);text-decoration:none">feed-curator</a></span>
  <span class="muted" style="padding: 0 8px;">管理后台</span>
  <a href="/admin" {% if request.url.path == '/admin' %}class="active"{% endif %}>概览</a>
  <a href="/admin/pipes" {% if request.url.path == '/admin/pipes' %}class="active"{% endif %}>渠道</a>
  <a href="/admin/domains" {% if request.url.path == '/admin/domains' %}class="active"{% endif %}>领域</a>
  <a href="/" style="margin-left:auto">← 返回订阅</a>
</nav>
{% else %}
<nav>
  <span class="brand">feed-curator</span>
  <a href="/" class="active">订阅</a>
  <a href="/admin" style="margin-left:auto">管理后台 →</a>
</nav>
{% endif %}
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
